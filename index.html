<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="멍백홈" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#ffffff" />
    <!-- 앱은 밝은 화면만 쓴다. 휴대폰 다크 모드가 색을 멋대로 뒤집어 코랄이 빨갛게 보이지 않도록 막는다. -->
    <meta name="color-scheme" content="only light" />
    <meta name="description" content="작은 목격이 소중한 재회로. 실종 강아지를 찾고, 주변의 목격 소식을 함께 나누는 멍백홈." />
    <!-- 홈 주소를 카카오톡·SNS에 공유할 때 보이는 카드. 강아지별 카드는 /d/:id 가 따로 만든다. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="멍백홈" />
    <meta property="og:title" content="멍백홈 — 잃어버린 강아지, 이웃과 함께 찾아요" />
    <meta property="og:description" content="사진과 장소만 있으면 바로 신고할 수 있어요. 본 강아지는 로그인 없이 알려줄 수 있어요." />
    <meta property="og:url" content="https://meongbackhome.com/" />
    <meta property="og:image" content="https://meongbackhome.com/og-home.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>멍백홈 — 다시, 따뜻한 집으로</title>
  </head>
  <body>
    <a class="skip-link" href="#main">본문 바로가기</a>
    <div id="app"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>

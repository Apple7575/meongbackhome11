services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: https://${APP_DOMAIN:?Set APP_DOMAIN in .env}
      PUSH_SUBJECT: mailto:${SUPPORT_EMAIL:?Set SUPPORT_EMAIL in .env}
      DATABASE_PATH: data/meongback.sqlite
      TRUST_PROXY: "1"
      RESEND_API_KEY: ${RESEND_API_KEY:?Set RESEND_API_KEY in .env}
      MAIL_FROM: ${MAIL_FROM:?Set verified MAIL_FROM in .env}
    volumes:
      - app_data:/app/data
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  app_data:
  caddy_data:
  caddy_config:
